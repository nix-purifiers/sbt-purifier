# SPDX-License-Identifier: MIT
#
# Releases checked main commits when Maven artifacts or the complete tracked
# source tree differ from the previous release. The source comparison covers
# native CLI/runtime exports that the plugin-only artifact comparison misses.
# Full-tree identity is conservative: documentation-only changes also release.
# Versions remain automatic <series>.<revision>. Every release retains the
# existing versioned Maven zip and Maven-layout SHA256SUMS, and additionally
# attaches an exact-commit source archive, manifest and SOURCE-SHA256SUMS.
# Old Maven consumers and Pages downloads keep their existing coordinates.
#
# Started by hand with `deploy`, the run rebuilds and deploys the site
# whether or not it releases. A new series (a manual edit of
# .github/release/series) starts at revision 1.
name: release

on:
  workflow_run:
    workflows: [check]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to release; main's head when empty
        required: false
        type: string
      site_only:
        description: Deploy documentation and existing Maven releases without rebuilding the plugin
        required: false
        type: boolean
      deploy:
        description: Rebuild and deploy the Maven repository on GitHub Pages even without a new release
        required: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # A check that main dispatched for a pull request also reports main's
    # head, so only a check of a push counts.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      deploy: 'true'
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - if: ${{ !inputs.site_only }}
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true

      - if: ${{ !inputs.site_only }}
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: clhodapp
          skipPush: true
          extraPullNames: nix-community,numtide

      - name: Decide the version
        id: decide
        env:
          SITE_ONLY: ${{ inputs.site_only }}
        run: |
          set -euo pipefail
          if [[ "$SITE_ONLY" == true ]]; then
            echo "release=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/release/source.py guard "$GITHUB_REPOSITORY" "$SHA"
          series=$(cat .github/release/series)
          last=$(git tag -l "v$series.*" | sort -V | tail -n 1)
          if [[ -z $last ]]; then
            echo "version=$series.1" >>"$GITHUB_OUTPUT"
            echo "release=true" >>"$GITHUB_OUTPUT"
            echo "No release of series $series yet."
            exit 0
          fi
          .github/release/build.sh "${last#v}" "$RUNNER_TEMP/last"
          gh release download "$last" --pattern SHA256SUMS --dir "$RUNNER_TEMP/released"
          previous_source=$(python3 .github/release/source.py fingerprint "$last^{commit}")
          current_source=$(python3 .github/release/source.py fingerprint "$SHA")
          if [[ "$previous_source" == "$current_source" ]] && cmp -s "$RUNNER_TEMP/last/SHA256SUMS" "$RUNNER_TEMP/released/SHA256SUMS"; then
            echo "release=false" >>"$GITHUB_OUTPUT"
            echo "$SHA matches both the sources and Maven artifacts of $last; nothing to release."
            exit 0
          fi
          echo "What $SHA builds differs from $last:"
          diff "$RUNNER_TEMP/released/SHA256SUMS" "$RUNNER_TEMP/last/SHA256SUMS" || true
          revision=${last##*.}
          echo "version=$series.$((revision + 1))" >>"$GITHUB_OUTPUT"
          echo "release=true" >>"$GITHUB_OUTPUT"

      - name: Build and create the release
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          python3 .github/release/source.py guard "$GITHUB_REPOSITORY" "$SHA"
          .github/release/build.sh "$VERSION" "$RUNNER_TEMP/release"
          python3 .github/release/source.py prepare "$GITHUB_REPOSITORY" "$SHA" "$VERSION" "$RUNNER_TEMP/source"
          zip="$RUNNER_TEMP/sbt-nix-backend-$VERSION-maven.zip"
          (cd "$RUNNER_TEMP/release" && zip -qr "$zip" . -x SHA256SUMS)
          nixpkgs=$(jq -r '.nodes[.nodes.root.inputs.nixpkgs].locked.rev' flake.lock)
          sbt1=$(grep -oP 'case "2\.12" => "\K[^"]+' build.sbt)
          sbt2=$(grep -oP 'case _ +=> "\K[^"]+' build.sbt)
          {
            echo "sbt-nix-backend $VERSION, built in the Nix sandbox from $SHA."
            echo
            echo "Install it in \`project/plugins.sbt\` (or in the meta-most build of a build that has several):"
            echo
            echo '```scala'
            echo 'resolvers += "sbt-nix-backend" at "https://nix-purifiers.github.io/sbt-purifier/maven"'
            echo "addSbtPlugin(\"io.github.clhodapp\" % \"sbt-nix-backend\" % \"$VERSION\")"
            echo '```'
            echo
            echo "The artifacts are also attached here, as a zip in Maven layout with their SHA256SUMS."
            echo
            echo "| Built against | Version |"
            echo "|---|---|"
            echo "| nixpkgs | \`$nixpkgs\` |"
            echo "| sbt 1 | $sbt1 |"
            echo "| sbt 2 | $sbt2 |"
          } >"$RUNNER_TEMP/notes.md"
          python3 .github/release/source.py guard "$GITHUB_REPOSITORY" "$SHA"
          gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "$zip" "$RUNNER_TEMP/release/SHA256SUMS" \
            "$RUNNER_TEMP/source/source.tar.gz" "$RUNNER_TEMP/source/release-manifest.json" \
            "$RUNNER_TEMP/source/SOURCE-SHA256SUMS"

      - name: Check out shared native publication infrastructure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nix-purifiers/nix-purifiers.github.io
          ref: 90b2d04ee9560ef75af80bd0a48d7d976c7b8824
          path: .pages-theme
          persist-credentials: false
      - name: Build the Maven repository from every release
        run: |
          set -euo pipefail
          zips="$RUNNER_TEMP/zips"
          mkdir -p "$zips"
          for tag in $(gh release list --limit 1000 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --pattern '*-maven.zip' --dir "$zips"
          done
          .github/release/pages.sh "$RUNNER_TEMP/site" "$zips"
          python3 .pages-theme/release/documentation_entry.py \
            --repository "$GITHUB_REPOSITORY" --site "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: release
    if: needs.release.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
