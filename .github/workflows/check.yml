# SPDX-License-Identifier: MIT
#
# Runs the test suite on both systems the flake supports, on every push to
# main, on every pull request, and when update.yml dispatches it. The
# flake's checks include the conformance checks of the purifier contract
# that the sandbox can run; the ones that need the network or a Nix daemon
# are the jobs of their names here. release.yml releases after a
# successful run of this workflow on a push to main.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Release source identity and publication gates
        run: python3 -B .github/release/test_source.py

  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      # The clhodapp cache, read only, holds builds of earlier runs.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: clhodapp
          skipPush: true
      - name: Flake checks
        run: nix flake check --print-build-logs

  # Relocking the fixtures reproduces their lockfiles byte for byte. The
  # consumer fixture locks the producer flake on GitHub at a pushed commit,
  # so tests/relock-fixtures.sh leaves it out here.
  conformance-relock:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: clhodapp
          skipPush: true
      - name: Relock the fixtures
        run: |
          SECONDS=0
          nix develop --command tests/relock-fixtures.sh --relock --skip-consumer
          echo "the relock took ${SECONDS}s"
          git diff --exit-code

  # The everyday loop of the fixtures works with the network cut off.
  conformance-offline:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: clhodapp
          skipPush: true
      - name: Interactive tests
        run: tests/interactive.sh

  conformance-update:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: clhodapp
          skipPush: true
      - name: Update moves the pinned producer
        run: tests/update.sh

  composition-native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        sbt: ['0.13.18', '1.11.7', '2.0.12']
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Native Nix project inputs and publication
        timeout-minutes: 53
        run: >-
          python3 tests/composition-native.py --sbt-version '${{ matrix.sbt }}'
          --results "$RUNNER_TEMP/sbt-composition-evidence"
      - name: Retain composition receipts and raw logs, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbt-composition-${{ matrix.runner }}-${{ matrix.sbt }}
          path: ${{ runner.temp }}/sbt-composition-evidence
          if-no-files-found: error

  # Original Ivy cache state, lock policy and offline runtime at one SDK point.
  ivy-capture:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            sandbox = true
            max-jobs = 2
            cores = 2
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: clhodapp
          skipPush: true
      - name: Native Ivy capture policy and sandboxed replay on sbt 1.13.1
        timeout-minutes: 100
        run: python3 -B tests/ivy-capture-ci.py --results "$RUNNER_TEMP/sbt-ivy-evidence"
      - name: Retain Ivy source, locks, derivations and native failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbt-ivy-${{ matrix.runner }}-1.13.1
          path: |
            ${{ runner.temp }}/sbt-ivy-evidence/*.json
            ${{ runner.temp }}/sbt-ivy-evidence/*.stdout
            ${{ runner.temp }}/sbt-ivy-evidence/*.stderr
            ${{ runner.temp }}/sbt-ivy-evidence/*.nar
            ${{ runner.temp }}/sbt-ivy-evidence/check-native/**
            ${{ runner.temp }}/sbt-ivy-evidence/check-mutable/**
            ${{ runner.temp }}/sbt-ivy-evidence/capture/*.json
            ${{ runner.temp }}/sbt-ivy-evidence/capture/*.stderr
            ${{ runner.temp }}/sbt-ivy-evidence/capture/logs/**
            ${{ runner.temp }}/sbt-ivy-evidence/capture/locks/*.json
            ${{ runner.temp }}/sbt-ivy-evidence/capture/snapshots/**/build.sbt
            ${{ runner.temp }}/sbt-ivy-evidence/capture/snapshots/**/build.properties
            ${{ runner.temp }}/sbt-ivy-evidence/capture/snapshots/**/*.java
          if-no-files-found: error
          retention-days: 14

  # The pin lifecycle follows the native x86 Linux tuple exercised locally.
  ivy-pin-return:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            sandbox = true
            max-jobs = 2
            cores = 2
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: clhodapp
          skipPush: true
      - name: Native Ivy pin to Nix provider and back on sbt 1.13.1
        timeout-minutes: 80
        run: >-
          python3 -B tests/ivy-pin-ci.py
          --results "$RUNNER_TEMP/sbt-ivy-pin-evidence"
          --runtime-directory "$RUNNER_TEMP/sbt-pin"
      - name: Retain pin lifecycle source, origins and partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbt-ivy-pin-ubuntu-24.04-1.13.1
          path: |
            ${{ runner.temp }}/sbt-ivy-pin-evidence/*.json
            ${{ runner.temp }}/sbt-ivy-pin-evidence/*.log
            ${{ runner.temp }}/sbt-ivy-pin-evidence/*.nar
            ${{ runner.temp }}/sbt-ivy-pin-evidence/experiment/*.json
            ${{ runner.temp }}/sbt-ivy-pin-evidence/experiment/logs/**
            ${{ runner.temp }}/sbt-ivy-pin-evidence/experiment/provider/*.nix
            ${{ runner.temp }}/sbt-ivy-pin-evidence/experiment/provider/flake.lock
            ${{ runner.temp }}/sbt-ivy-pin-evidence/experiment/snapshots/**/build.sbt
            ${{ runner.temp }}/sbt-ivy-pin-evidence/experiment/snapshots/**/build.properties
            ${{ runner.temp }}/sbt-ivy-pin-evidence/experiment/snapshots/**/*.java
          if-no-files-found: error
          retention-days: 14

  # Exact SDK points, with a real upstream sample on sbt 1 and the existing
  # sbt 2 fixture. Native controls, locking, prefetch, empty-cache offline
  # tests and sandboxed builds all execute on each runner.
  runtime-sample:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-latest]
        sample:
          - {fixture: independent, sbt: '1.11.7'}
          - {fixture: independent, sbt: '1.13.1'}
          - {fixture: sbt2, sbt: '2.0.12'}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            sandbox = true
            max-jobs = 2
            cores = 2
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: clhodapp
          skipPush: true
      - name: Independent sample lifecycle
        run: >-
          python3 tests/runtime-sample.py --results "$RUNNER_TEMP/sbt-runtime-evidence"
          --fixture '${{ matrix.sample.fixture }}' --sbt-version '${{ matrix.sample.sbt }}'
      - name: Retain JVM and Darwin crash diagnostics
        if: failure()
        run: python3 tests/collect-runtime-crashes.py --results "$RUNNER_TEMP/sbt-runtime-evidence"
      - name: Retain source and runtime receipts, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbt-runtime-${{ matrix.runner }}-${{ matrix.sample.fixture }}-${{ matrix.sample.sbt }}
          path: |
            ${{ runner.temp }}/sbt-runtime-evidence/*.json
            ${{ runner.temp }}/sbt-runtime-evidence/*.log
            ${{ runner.temp }}/sbt-runtime-evidence/*.nix
            ${{ runner.temp }}/sbt-runtime-evidence/crash-reports/*
          if-no-files-found: error
          retention-days: 14

  implementation-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
        fixture: [multi, sbt2]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            sandbox = true
      - name: Two immutable implementations through native sbt and loaded plugin
        env:
          SOURCE_REV: ${{ github.event.pull_request.head.sha || github.sha }}
          FIXTURE: ${{ matrix.fixture }}
        run: |
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix run ".#checks.$system.implementation-lifecycle-driver" -- \
            --current "github:nix-purifiers/sbt-purifier/$SOURCE_REV" \
            --fixture "$PWD/tests/fixtures/$FIXTURE" \
            --workdir "$RUNNER_TEMP/sbt-implementation"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sbt-implementation-${{ matrix.runner }}-${{ matrix.fixture }}
          path: |
            ${{ runner.temp }}/sbt-implementation/receipt.json
            ${{ runner.temp }}/sbt-implementation/logs
          if-no-files-found: warn
